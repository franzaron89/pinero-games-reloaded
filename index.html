<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piñero Games Reloaded</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <h2>JUEGOS</h2>
    <nav>
      <a class="active" href="#juegos">🎮 <span>Todos</span></a>
      <a href="#accion">⚡ <span>Acción</span></a>
      <a href="#carreras">🏁 <span>Carreras</span></a>
      <a href="#plataformas">▰ <span>Plataformas</span></a>
    </nav>
    <p class="side-note">PIÑERO<br>GAMES</p>
  </aside>

  <main>
    <header class="hero">
      <div class="hero-copy">
        <h1>PIÑERO GAMES</h1>
        <p>RELOADED</p>
      </div>
      <div class="neon-mark" aria-hidden="true">✦</div>
    </header>

    <section id="juegos" class="games-section">
      <div class="section-heading">
        <h2>JUEGA AHORA</h2>
        <span></span>
      </div>
      <div class="games-grid">
        <a class="game-card" href="#" data-game="carreras">
          <div class="game-art art-racing">🏎️</div>
          <div class="game-title">🏁 <span>RACE LEGENDS</span></div>
        </a>
        <a class="game-card" href="#" data-game="plataformas">
          <div class="game-art art-platform">🪙</div>
          <div class="game-title">▰ <span>PIXEL QUEST</span></div>
        </a>
        <a class="game-card" href="#" data-game="accion">
          <div class="game-art art-action">🎯</div>
          <div class="game-title">◎ <span>BATTLE ZONE</span></div>
        </a>
        <a class="game-card" href="#" data-game="aventura">
          <div class="game-art art-blocks">🌲</div>
          <div class="game-title">⬡ <span>BLOCK SURVIVAL</span></div>
        </a>
      </div>
      <p class="hint">Plantilla de ejemplo: sustituye estas tarjetas por tus juegos HTML cuando los tengas.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
